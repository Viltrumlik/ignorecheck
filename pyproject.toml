[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ignorecheck"
version = "0.1.0"
description = "Find files git tracks that it should not."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["git", "gitignore", "secrets", "security", "ci", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/ignorecheck"
Issues = "https://github.com/Viltrumlik/ignorecheck/issues"

[project.scripts]
ignorecheck = "ignorecheck:main"

[tool.setuptools]
py-modules = ["ignorecheck"]
